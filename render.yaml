# Render Configuration
# This file configures automatic deployment on Render

services:
  # Backend Web Service
  - type: web
    name: battleconnect-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://battleconnect.onrender.com
    healthCheckPath: /health
    
  # Frontend Static Site  
  - type: web
    name: battleconnect-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://battleconnect-backend.onrender.com